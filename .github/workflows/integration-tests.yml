name: Integration Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:  # manual run adds the live-model job
  schedule:
    - cron: "0 6 * * 1"  # weekly, so a model or Ollama regression is noticed

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
    - name: Run tests (mocked LLM, no model needed)
      run: pytest -q tests/

  live-model:
    # CPU-only runner: slow, so run weekly or on demand instead of on every push
    if: github.event_name != 'push' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    services:
      ollama:
        image: ollama/ollama:latest
        ports:
          - 11434:11434
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
    - name: Wait for Ollama, then pull the model
      run: |
        for i in $(seq 1 30); do
          curl -sf http://localhost:11434/api/tags > /dev/null && break
          sleep 2
        done
        curl -sf http://localhost:11434/api/tags > /dev/null
        curl -sf -X POST http://localhost:11434/api/pull -d '{"name": "phi3:mini", "stream": false}'
    - name: Run pipeline against the live model
      env:
        LLM_ENDPOINT: "http://localhost:11434"
        LLM_MODEL: "phi3:mini"
        LLM_TIMEOUT: "120"
      run: |
        python -m src.pipeline --mode compare --num_samples 10
        # Fail the job if any item ended in an inference error (fail-closed -1)
        python -c "import json,sys; m=json.load(open('guardrail_simulation.json'))['metadata']['metrics']; print(m); sys.exit(1 if m['Errors'] else 0)"
